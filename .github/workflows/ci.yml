name: ci

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libclang-dev
      - name: 配置 Windows libclang
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: 诊断环境
        run: |
          cargo -vV
          env | grep -iE 'cargo|rust' | sort
          cargo config get --format toml 2>/dev/null || true
      - run: cargo test --verbose
      - run: cargo clippy --all-targets -- -D warnings
