name: ci

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libclang-dev
      - name: 配置 Windows libclang
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: 配置运行时库路径
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$(pwd -W)/sdk/windows" >> $GITHUB_PATH
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "DYLD_FALLBACK_LIBRARY_PATH=$PWD/sdk/macos" >> $GITHUB_ENV
          else
            echo "LD_LIBRARY_PATH=$PWD/sdk/linux" >> $GITHUB_ENV
          fi
      - run: cargo test --verbose
      - run: cargo clippy --all-targets -- -D warnings
