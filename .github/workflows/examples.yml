name: examples

# 手动触发：在 GitHub 仓库页 Actions → examples → Run workflow 选择示例。
# 需要先在 Settings → Secrets and variables → Actions 配置 CTP_* 密钥。
on:
  workflow_dispatch:
    inputs:
      example:
        description: "要运行的示例"
        type: choice
        options: [md, trader, both]
        default: md
      instrument:
        description: "行情示例订阅的合约"
        default: "ag2612"

jobs:
  run:
    name: ${{ matrix.os }} · ${{ github.event.inputs.example }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CTP_BROKER_ID: ${{ secrets.CTP_BROKER_ID }}
      CTP_USER_ID: ${{ secrets.CTP_USER_ID }}
      CTP_PASSWORD: ${{ secrets.CTP_PASSWORD }}
      CTP_APP_ID: ${{ secrets.CTP_APP_ID }}
      CTP_AUTH_CODE: ${{ secrets.CTP_AUTH_CODE }}
      CTP_MARKET_FRONT: ${{ secrets.CTP_MARKET_FRONT }}
      CTP_TRADE_FRONT: ${{ secrets.CTP_TRADE_FRONT }}
      CTP_INSTRUMENT: ${{ github.event.inputs.instrument }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libclang-dev
      - name: 配置 Windows libclang
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: 运行示例
        shell: bash
        run: |
          case "${{ github.event.inputs.example }}" in
            md) cargo run --example md ;;
            trader) cargo run --example trader ;;
            *) cargo run --example md && cargo run --example trader ;;
          esac
