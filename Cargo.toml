[package]
name = "ctp-base"
version = "1.1.1"
edition = "2024"
authors = ["Cambridge"]
description = "CTP 行情与交易 API 的安全 Rust 绑定：owned 回调、强类型字段与 request_id 语义"
repository = "https://github.com/Cambridge1995/ctp-base"
documentation = "https://docs.rs/ctp-base"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ctp", "futures", "trading", "shfe", "ffi"]
categories = ["api-bindings", "finance"]
exclude = ["/sdk/windows", "/sdk/linux", "/sdk/macos"]

[dependencies]
cxx = "1.0"
encoding_rs = "0.8"

[build-dependencies]
bindgen = "0.72"
cc = "1.0"
cxx-build = "1.0"

[[test]]
name = "unit"
path = "tests/unit.rs"

[package.metadata.docs.rs]
# docs.rs 使用系统 tar 解压 sdk/binaries.tar.xz，无需网络。
targets = ["x86_64-unknown-linux-gnu"]
